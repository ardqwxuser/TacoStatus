  # baseUrl: /your-repo-name
  logoUrl: https://tacoproject.com.tr/app/main/theme/assets/img/uploads/2c547b861cbb8410138f80ff0077cadd.png?v=1761821050
  name: TacoStatus
  introTitle: "**Sunucuların Durum Sayfası** — Web siteleri ve Oyun sunucularını anlık olarak izler."
  introMessage: This is a sample status page which uses **real-time** data from our [GitHub repository](https://github.com/upptime/upptime). No server required — just GitHub Actions, Issues, and Pages. [**Get your own for free**](https://github.com/upptime/upptime)
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/ardqwxuser/TacoStatus
  skipdelays: true # Bildirimlerin gecikme olmadan hemen gönderilmesini sağlar

